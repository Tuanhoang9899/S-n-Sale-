name: Auto Run Deal Crawler

on:
  schedule:
    # Chạy tự động mỗi 2 tiếng một lần
    - cron: '0 */2 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run crawler script
        run: python crawler.py

      - name: Commit and push deals.json if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add deals.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update deals.json via crawler" && git push)name: Auto Run Deal Crawler

